<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>Quiet Pixel Pet</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preload" as="video" href="animations/idle/idle_breathing.mp4" />
    <link rel="preload" as="video" href="animations/idle/idle_variation.mp4" />
  </head>
  <body>
    <main class="game" aria-label="Tamagotchi game">
      <div class="hardware-top" aria-hidden="true">
        <span class="strap-hole"></span>
        <span class="shell-screw shell-screw-left"></span>
        <span class="shell-screw shell-screw-right"></span>
        <span class="brand-mark">MamiGuchi</span>
      </div>

      <section class="display" aria-label="Character animation screen">
        <video
          id="petVideo"
          class="pet-video"
          muted
          autoplay
          loop
          playsinline
          preload="auto"
          disablepictureinpicture
        ></video>

        <div class="lcd-glass" aria-hidden="true"></div>

        <nav class="icon-overlay" aria-label="Actions">
          <button class="icon-slot icon-food" data-action="food" aria-label="Food">
            <img src="ui/icons/icon_food.png" alt="" draggable="false" />
          </button>
          <button class="icon-slot icon-sleep" data-action="sleep" aria-label="Sleep">
            <img src="ui/icons/icon_sleep.png" alt="" draggable="false" />
          </button>
          <button class="icon-slot icon-game" data-action="game" aria-label="Game">
            <img src="ui/icons/icon_game.png" alt="" draggable="false" />
          </button>
          <button class="icon-slot icon-love" data-action="love" aria-label="Love">
            <img src="ui/icons/icon_love.png" alt="" draggable="false" />
          </button>
        </nav>
      </section>

      <section class="control-layer" aria-label="Button controls">
        <div class="button-cradle button-cradle-cycle">
          <button class="control-zone" data-control="cycle" aria-label="Button 1"></button>
        </div>
        <div class="speaker-grille" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
        <div class="button-cradle button-cradle-confirm">
          <button class="control-zone" data-control="confirm" aria-label="Button 2"></button>
        </div>
      </section>
    </main>

    <div class="portrait-lock" aria-label="Portrait mode only"></div>

    <script src="app.js"></script>
  </body>
</html>
